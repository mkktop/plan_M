name: Desktop release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag with a successful desktop build
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Find the verified build for this source
        id: build
        uses: actions/github-script@v7
        with:
          script: |
            const { findVerifiedRun } = require('./scripts/release-artifacts.cjs');
            const runId = await findVerifiedRun({ github, context, tag: process.env.RELEASE_TAG });
            core.setOutput('run_id', runId);
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-installer'
          path: installers
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify provenance and upload installer
        uses: actions/github-script@v7
        with:
          script: |
            const { uploadInstallers } = require('./scripts/release-artifacts.cjs');
            await uploadInstallers({ github, context, core, tag: process.env.RELEASE_TAG,
              directory: 'installers', platforms: ['windows-x64'] });
